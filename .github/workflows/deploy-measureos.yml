name: Deploy MEASURE OS to VPS

on:
  push:
    branches:
      - milestone/package-a-phase1

concurrency:
  group: deploy-measureos
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.MEASUREOS_VPS_HOST }}
          username: ${{ secrets.MEASUREOS_VPS_USER }}
          key: ${{ secrets.MEASUREOS_VPS_SSH_KEY }}
          script: deploy-measureos
