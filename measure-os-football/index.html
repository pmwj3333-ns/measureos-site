<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MEASURE OS Football</title>
  <script>
    (function redirectToEntry() {
      const match = window.location.pathname.match(/^(.*\/measure-os-football)/);
      const root = match ? match[1] : "/measure-os-football";
      const homePath = `${root}/home/v0.1/index.html`;
      const loginPath = `${root}/auth/v0.1/login.html`;

      try {
        const session = JSON.parse(window.localStorage.getItem("measure-os-football:auth-session:v1") || "null");
        const hasSession = Boolean(session?.userId && session?.teamId);
        window.location.replace(hasSession ? homePath : loginPath);
      } catch (_) {
        window.location.replace(loginPath);
      }
    })();
  </script>
</head>
<body>
  <p><a href="/measure-os-football/home/v0.1/index.html">MEASURE OS Football Home</a></p>
</body>
</html>
