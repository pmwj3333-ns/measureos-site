<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MEASURE OS Football - Observer v0.2</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">MEASURE OS Football</p>
        <h1>Observer v0.2</h1>
      </div>
      <div class="match-clock" aria-label="match clock">
        <span>Observation Time</span>
        <strong id="clock">00:00</strong>
      </div>
    </header>

    <section class="game-plan-card panel" aria-labelledby="game-plan-title">
      <div class="game-plan-head">
        <h2 id="game-plan-title">Game Plan</h2>
        <p id="game-plan-empty" class="muted">Game Plan が登録されていません</p>
      </div>
      <div id="game-plan-content" class="game-plan-content" hidden></div>
    </section>

    <section class="control-strip panel" aria-label="observation controls">
      <div class="team-toggle" role="group" aria-label="team selection">
        <button type="button" class="selected" data-team="home">Home</button>
        <button type="button" data-team="away">Away</button>
      </div>
      <div class="clock-actions">
        <button id="clock-toggle" type="button" class="primary">Start</button>
        <button id="clock-reset" type="button">Reset</button>
      </div>
    </section>

    <section class="panel event-panel" aria-labelledby="event-title">
      <div class="panel-head">
        <div>
          <h2 id="event-title">Observation</h2>
          <p class="muted">客観的イベントのみを1タップで記録します。</p>
        </div>
        <p id="saved-status" class="saved-status" aria-live="polite">未入力</p>
      </div>
      <div id="event-categories" class="event-categories"></div>
    </section>

    <section class="panel timeline-panel" aria-labelledby="timeline-title">
      <div class="panel-head">
        <div>
          <h2 id="timeline-title">イベントタイムライン</h2>
          <p class="muted">入力順に表示します。</p>
        </div>
        <button id="clear-events" type="button">Clear Events</button>
      </div>
      <ol id="timeline" class="timeline" aria-live="polite"></ol>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
