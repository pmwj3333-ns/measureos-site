<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MEASURE OS Football - Settings</title>
  <link rel="stylesheet" href="../../shared/page-shell.css" />
  <link rel="stylesheet" href="../../shared/ui-system.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="settings-app">
  <main class="page-container page-shell settings-shell">
    <header class="page-hero" aria-labelledby="page-title">
      <p class="page-eyebrow">MEASURE OS Football</p>
      <h1 id="page-title" class="page-title">Settings</h1>
      <p class="page-description">チーム情報とアカウント設定。</p>
    </header>

    <section class="settings-panel panel" aria-labelledby="team-settings-title">
      <h2 id="team-settings-title" class="settings-section-title">Team</h2>
      <form id="team-form" class="settings-form">
        <div class="field">
          <label for="team-name">チーム名</label>
          <input id="team-name" type="text" maxlength="80" required />
        </div>
        <p id="team-save-status" class="settings-status muted" aria-live="polite"></p>
        <button type="submit" class="primary">保存</button>
      </form>
    </section>

    <section class="settings-panel panel" aria-labelledby="password-settings-title">
      <h2 id="password-settings-title" class="settings-section-title">パスワード変更</h2>
      <form id="password-form" class="settings-form">
        <div class="field">
          <label for="current-password">現在のパスワード</label>
          <input id="current-password" type="password" autocomplete="current-password" required />
        </div>
        <div class="field">
          <label for="new-password">新しいパスワード</label>
          <input id="new-password" type="password" autocomplete="new-password" minlength="8" required />
        </div>
        <div class="field">
          <label for="confirm-password">確認用パスワード</label>
          <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required />
        </div>
        <p id="password-save-status" class="settings-status muted" aria-live="polite"></p>
        <button type="submit" class="primary">パスワードを変更</button>
      </form>
    </section>

    <section class="settings-panel panel" aria-labelledby="account-settings-title">
      <h2 id="account-settings-title" class="settings-section-title">Account</h2>
      <p class="settings-account-row">
        <span>メールアドレス</span>
        <strong id="account-email">-</strong>
      </p>
      <p class="settings-account-row">
        <span>Role</span>
        <strong id="account-role">owner</strong>
      </p>
      <button id="logout-button" type="button">ログアウト</button>
    </section>

    <p class="settings-back">
      <a href="../../home/v0.1/index.html">Home に戻る</a>
    </p>
  </main>

  <script>
    window.MO_AUTH_LOGIN_PATH = "../../auth/v0.1/login.html";
    window.MO_APP_HOME_PATH = "../../home/v0.1/index.html";
  </script>
  <script src="../../shared/storage-keys.js"></script>
  <script src="../../shared/authentication.js"></script>
  <script src="../../shared/team-context.js"></script>
  <script src="../../shared/match-context.js"></script>
  <script src="../../shared/auth-guard.js"></script>
  <script src="./app.js"></script>
</body>
</html>
